# H2 In-Memory Database for automated tests (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:whistledrop_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT configuration
jwt.secret=whistledropTestJwtSecretKeyForAutomatedTestsLongEnoughKey12345
jwt.expiration-ms=86400000

# Default initial moderator for tests
app.default-moderator.username=moderator
app.default-moderator.password=password
