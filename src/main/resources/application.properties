# Server configuration
server.port=${PORT:8080}

# PostgreSQL Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/whistledrop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Security
jwt.secret=${JWT_SECRET:whistledropDefaultJwtSecretKeyForDevelopmentMustBe32BytesPlus}
jwt.expiration-ms=86400000

# Default initial moderator credentials (for first boot setup)
app.default-moderator.username=moderator
app.default-moderator.password=password

# Swagger / OpenAPI documentation paths
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
