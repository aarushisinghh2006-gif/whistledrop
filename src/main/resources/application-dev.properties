# Development profile: file-based persistent database in PostgreSQL mode
# Allows running the full backend locally without needing an external PostgreSQL installation
spring.datasource.url=jdbc:h2:file:./data/whistledrop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
